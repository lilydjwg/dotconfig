  <!-- <match target="pattern">
    <test name="prgname" compare="eq">
      <string>Telegram</string>
    </test>
    <test qual="any" name="family">
      <string>文泉驿正黑</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>思源黑体</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq">
      <string>Telegram</string>
    </test>
    <test qual="any" name="family">
      <string>文泉驿等宽正黑</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>思源黑体</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq">
      <string>fcitx5</string>
