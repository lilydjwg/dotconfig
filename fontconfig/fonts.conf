<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!-- rendering options {{{1 -->
  <match target="font">
    <edit mode="assign" name="autohint">
      <bool>false</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>

  <!-- no embeddedbitmap except for Twemoji {{{1 -->
  <match target="font">
    <test name="family" compare="not_eq">
      <string>Twemoji</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- no antialias for Twemoji {{{1
    or in italic in gvim it shows blank
    qual="all", or firefox uses web font non-aliased for https://status.python.org/
    specific to gvim, or Google Chrome uses web font non-aliased, e.g. home page, github.
  -->
  <match target="font">
    <test name="prgname" compare="eq">
      <string>gvim</string>
    </test>
    <test name="family" compare="eq">
      <string>Twemoji</string>
    </test>
    <edit mode="assign" name="antialias">
      <bool>false</bool>
    </edit>
  </match>

  <!-- includes {{{1 -->
  <include prefix="xdg">fontconfig/web-ui-fonts.conf</include>
  <include prefix="xdg">fontconfig/web.conf</include>
  <include prefix="xdg">fontconfig/win-replacements.conf</include>
  <include prefix="xdg">fontconfig/source-han-for-noto-cjk.conf</include>

  <!-- default fonts for Arabic {{{1 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- default fonts for Persion {{{1 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>fa</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>fa</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>fa</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- default fonts for Urdu {{{1 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <!-- default fonts for latin scripts {{{1 -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
      <!--
        I override DejaVu Sans with Open Sans Semibold for Telegram to get the
        semibold font correct, however Open Sans doesn't cover some IPA symbols,
        and Qt would fallback to some strange font (Twemoji?) and doesn't
        render them at all.
        Add Noto Sans as fallback here.
      -->
      <string>Noto Sans</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="family">
      <string>emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Twemoji</string>
    </edit>
  </match>

  <!-- default fonts {{{1 -->
  <!-- Source Han includes locl support for CJK locales so we don't need to specify fonts for each locale -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <!-- Noto Sans Symbols has weird height for 🅥 -->
      <!-- use SC name to default to zh_CN when locale is e.g. en -->
      <string>思源黑体</string>
      <!-- Font Awesome has monocolor ⛩, affecting Qt5 (KeepassXC), Qt6 (Wireshark), GTK3 (Firefox, GVim), GTK4 (gtk4-demo) -->
      <string>Twemoji</string>
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
      <!-- or Noto Nastaliq Urdu will be chosen, which is weird for Arabic -->
      <string>Noto Sans Arabic</string>
      <!-- Noto Fangsong KSS Rotated, well, is rotated; while the Vertical one doesn't stack right. -->
      <string>Noto Serif Khitan Small Script</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <!-- websites may specify lang=en and defaults to serif -->
      <string>思源宋体</string>
      <string>Twemoji</string>
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
      <!-- or Noto Nastaliq Urdu will be chosen, which is weird for Arabic -->
      <string>Noto Sans Arabic</string>
      <!-- Noto Fangsong KSS Rotated, well, is rotated; while the Vertical one doesn't stack right. -->
      <string>Noto Serif Khitan Small Script</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>思源黑体</string>
      <string>Twemoji</string>
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
      <!-- or Noto Nastaliq Urdu will be chosen, which is weird for Arabic -->
      <string>Noto Sans Arabic</string>
      <!-- Noto Fangsong KSS Rotated, well, is rotated; while the Vertical one doesn't stack right. -->
      <string>Noto Serif Khitan Small Script</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="family">
      <string>emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Twemoji</string>
    </edit>
  </match>

  <!-- includes after default fonts {{{1 -->
  <include prefix="xdg">fontconfig/lily-han-for-source-han.conf</include>

  <!-- 样式调整 {{{1 -->
  <match target="scan">
    <test qual="any" name="family">
      <string>文泉驿等宽正黑</string>
    </test>
    <edit name="slant" binding="same" mode="append">
      <const>Italic</const>
    </edit>
  </match>
  <match target="scan">
    <test qual="any" name="family">
      <string>思源黑体</string>
    </test>
    <edit name="slant" binding="same" mode="append">
      <const>Italic</const>
    </edit>
  </match>
  <match target="scan">
    <test qual="any" name="family">
      <string>Twemoji</string>
    </test>
    <edit name="slant" binding="same" mode="append">
      <const>Italic</const>
    </edit>
  </match>
  <!-- <match target="pattern">
    <test qual="any" name="family">
      <string>文泉驿等宽正黑</string>
    </test>
    <test name="slant">
      <const>Italic</const>
    </test>
    <edit name="family" binding="same" mode="prepend">
      <string>华文楷体</string>
    </edit>
  </match>
  <match target="scan">
    <test qual="any" name="family">
      <string>华文楷体</string>
    </test>
    <edit name="slant" binding="same" mode="append">
      <const>Italic</const>
    </edit>
  </match>                                                  -->

