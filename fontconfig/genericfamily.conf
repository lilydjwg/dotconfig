<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!--
    fix for Firefox chooses "Font Awesome 7 Free" or "Noto Sans Symbols"
    for some emojis (e.g. ⛩) when setting "font-family: sans-serif;"
  -->
  <match>
    <test qual="any" name="genericfamily">
      <int>1</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>serif</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>2</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>3</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>monospace</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>4</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>cursive</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>5</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>fantasy</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>6</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>system-ui</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>7</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>ui-serif</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>8</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>ui-sans-serif</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>9</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>ui-monospace</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>10</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>ui-rounded</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>11</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>emoji</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>12</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>math</string>
    </edit>
  </match>
  <match>
    <test qual="any" name="genericfamily">
      <int>13</int>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>fangsong</string>
    </edit>
  </match>
</fontconfig>
